name: Run unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.swift'

# Kill any previous run still executing
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  UnitTests:
    runs-on: macos-latest
    name: Run unit tests

    steps:
    - uses: actions/checkout@v7
    - name: Unit Test (macOS)
      run: swift test -v

    - name: Unit Test (iOS)
      run: |
        UDID=$(xcrun simctl list devices available | grep 'iPhone' | head -1 | grep -Eo '[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}')
        xcodebuild test -scheme ManagedAppConfigLib -destination "id=$UDID"

    - name: Unit Test (tvOS)
      run: |
        UDID=$(xcrun simctl list devices available | grep 'Apple TV' | head -1 | grep -Eo '[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}')
        xcodebuild test -scheme ManagedAppConfigLib -destination "id=$UDID"
